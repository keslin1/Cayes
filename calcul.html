<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkilatris pwa ak pri - les cayes dropshipping</title>
    <style>
        :root {
            --primary: #27ae60;
            --secondary: #2c3e50;
            --accent: #e67e22;
            --bg: #f0f2f5;
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--bg);
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        .container {
            width: 100%; max-width: 450px;
            background: white; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden; position: relative;
        }

        /* Filigrane "Preuve" par-dessus les résultats */
        .watermark-proof {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 200px; opacity: 0.06; pointer-events: none; z-index: 5;
        }

        .header {
            background: var(--secondary); color: white;
            padding: 15px; text-align: center;
        }

        .machandiz-img {
            width: 50px; height: 50px; border-radius: 8px;
            object-fit: cover; border: 2px solid var(--primary);
        }

        .form-section { padding: 20px; position: relative; z-index: 10; }

        .input-grid {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-bottom: 20px;
        }

        .input-group label {
            display: block; font-size: 0.7rem; font-weight: bold;
            margin-bottom: 5px; color: #7f8c8d;
        }

        input {
            width: 100%; padding: 10px; border: 2px solid #edf2f7;
            border-radius: 10px; box-sizing: border-box; text-align: center;
        }

        .actions { display: flex; gap: 8px; }
        button {
            flex: 2; padding: 14px; border: none; border-radius: 10px;
            background: var(--primary); color: white; font-weight: bold; cursor: pointer;
        }

        .btn-clear { flex: 1; background: #ee5253; }

        /* Style des résultats actuels */
        .current-res {
            margin-top: 20px; padding: 15px; border-radius: 12px;
            background: #f8fff9; border: 1px dashed var(--primary);
            text-align: center; display: none;
        }

        /* Style Historique */
        .history-area {
            width: 100%; max-width: 450px; margin-top: 20px;
        }
        .history-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; color: var(--secondary); }
        
        .history-card {
            background: white; padding: 12px; border-radius: 10px;
            margin-bottom: 8px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.85rem; border-left: 4px solid var(--primary);
        }

        .hist-date { font-size: 0.7rem; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="machandiz.jpg" alt="Machandiz" class="machandiz-img">
        <h2 style="margin:5px 0 0; font-size: 1rem;">Les Cayes Dropshipping</h2>
    </div>

    <img src="lescayesdropshipping.png" class="watermark-proof">

    <div class="form-section">
        <div class="input-grid">
            <div class="input-group"><label>Longè (cm)</label><input type="number" id="L"></div>
            <div class="input-group"><label>Lajè (cm)</label><input type="number" id="l"></div>
            <div class="input-group"><label>Wotè (cm)</label><input type="number" id="H"></div>
        </div>

        <div class="actions">
            <button onclick="kalkile()">Kalkile</button>
            <button class="btn-clear" onclick="resetAll()">Efase</button>
        </div>

        <div id="currentRes" class="current-res">
            <div style="font-size: 0.8rem;">Pwa: <strong id="p_res">0</strong> liv</div>
            <div style="font-size: 1.4rem; color: var(--accent); font-weight: bold;">$ <span id="pr_res">0</span></div>
            <div id="tarif_res" style="font-size: 0.7rem; color: var(--primary);"></div>
        </div>
    </div>
</div>

<div class="history-area">
    <div class="history-title">Istorik dènye kalkil yo</div>
    <div id="historyList"></div>
</div>

<script>
    // Chaje istorik depi Local Storage
    let historyData = JSON.parse(localStorage.getItem('lcd_history')) || [];
    renderHistory();

    function kalkile() {
        const L = parseFloat(document.getElementById('L').value);
        const l = parseFloat(document.getElementById('l').value);
        const H = parseFloat(document.getElementById('H').value);

        if (L > 0 && l > 0 && H > 0) {
            const pwa = (L * l * H) / 4000;
            let tarif = 4.90;
            
            if (pwa >= 50 && pwa <= 200) {
                tarif = 3.99;
            }

            const pri = pwa * tarif;
            const dat = new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

            // Mise à jour interface
            document.getElementById('p_res').innerText = pwa.toFixed(2);
            document.getElementById('pr_res').innerText = pri.toFixed(2);
            document.getElementById('tarif_res').innerText = "Tarif: $" + tarif + "/lb";
            document.getElementById('currentRes').style.display = 'block';

            // Sauvegarde historique
            addHistory(pwa.toFixed(2), pri.toFixed(2), dat);
        }
    }

    function addHistory(pwa, pri, dat) {
        historyData.unshift({ pwa, pri, dat });
        
        // Limite à 10 éléments
        if (historyData.length > 10) {
            historyData.pop();
        }
        
        localStorage.setItem('lcd_history', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = '';
        
        historyData.forEach(item => {
            list.innerHTML += `
                <div class="history-card">
                    <div>
                        <strong>${item.pwa} liv</strong><br>
                        <span class="hist-date">${item.dat}</span>
                    </div>
                    <div style="font-weight: bold; color: var(--accent);">$ ${item.pri}</div>
                </div>
            `;
        });
    }

    function resetAll() {
        document.getElementById('L').value = '';
        document.getElementById('l').value = '';
        document.getElementById('H').value = '';
        document.getElementById('currentRes').style.display = 'none';
    }
</script>

</body>
</html>
