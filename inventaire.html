<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate" />
    <title>Envantè - Les Cayes Dropshipping</title>

    <link rel="stylesheet" href="base.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/lescayesdropshipping.png">

    <style>
        /* ── VARIABLES ── */
        :root {
            --bleu-marin: #001f3f;
            --bleu-clair: #0074D9;
            --vert-menu: #004D40;
            --rouge: #e74c3c;
            --kaki: #8fbc8f;
            --white: #ffffff;
            --gris-border: #e8ecf0;
            --texte: #333;
            --top-bar-h: 60px;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Poppins', 'Nunito', sans-serif;
            background: #f0f2f5;
            color: var(--texte);
            padding-top: var(--top-bar-h);
            padding-bottom: 30px;
        }

        .hidden { display: none !important; }

        /* ── PAGE LOADER ── */
        #page-loader {
            position: fixed; inset: 0; background: rgba(255,255,255,0.94);
            z-index: 9990; display: none; align-items: center; justify-content: center;
        }
        #page-loader.show { display: flex; }
        .pl-inner { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
        .pl-ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 4px solid #f0f0f0; border-top-color: var(--rouge);
            animation: plSpin 0.85s linear infinite;
        }
        .pl-logo { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; }
        @keyframes plSpin { to { transform: rotate(360deg); } }

        /* ── TOP BAR ── */
        #top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: var(--top-bar-h);
            background: var(--white); border-bottom: 1px solid var(--gris-border);
            display: flex; align-items: center; padding: 0 14px; gap: 10px;
            z-index: 600; box-shadow: var(--shadow-sm);
        }

        .tb-back-btn {
            width: 38px; height: 38px; border-radius: 10px; background: #f0f0f0;
            border: none; display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--bleu-marin); flex-shrink: 0;
        }

        .tb-brand { flex: 1; display: flex; align-items: center; gap: 9px; cursor: pointer; }
        .tb-logo  { width: 30px; height: 30px; border-radius: 7px; object-fit: contain; }
        .tb-title { font-size: 16px; font-weight: 900; color: var(--bleu-marin); }

        /* ── MAIN CONTENT ── */
        #main-content { padding: 18px 14px; }

        /* ── EN-TÊTE EXPLICATIF ── */
        .inv-intro-card {
            background: linear-gradient(135deg, #4682B4 0%, #003d7a 100%);
            border-radius: 16px;
            padding: 18px 18px 16px;
            margin-bottom: 16px;
            color: white;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }
        .inv-intro-icon {
            width: 40px; height: 40px; border-radius: 12px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .inv-intro-icon .material-icons { font-size: 20px; color: #FFD700; }
        .inv-intro-title { font-size: 14px; font-weight: 900; margin-bottom: 4px; }
        .inv-intro-text  { font-size: 12.5px; line-height: 1.5; opacity: 0.85; }

        /* ── FORMULAIRE AJOUT ── */
        .inv-form-card {
            background: white;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
        }

        .inv-form-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--bleu-marin);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .inv-input {
            width: 100%;
            padding: 11px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            outline: none;
            background: #fafafa;
            transition: border-color 0.2s;
            margin-bottom: 8px;
        }
        .inv-input:focus  { border-color: var(--bleu-marin); background: white; }
        .inv-input.error  { border-color: var(--rouge); }

        textarea.inv-input {
            resize: vertical;
            min-height: 90px;
            line-height: 1.5;
            margin-bottom: 0;
        }

        .inv-form-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .inv-add-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 16px;
            background: var(--vert-menu);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .inv-add-btn:active { opacity: 0.85; }

        .inv-cancel-btn {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 16px;
            background: #f0f0f0;
            color: #666;
            border: none;
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
        }

        /* ── LISTE DES NÒT ── */
        .inv-list-title {
            font-size: 12px;
            font-weight: 800;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
            padding: 0 2px;
        }

        .inv-note-card {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-sm);
            border-left: 3px solid transparent;
            transition: border-color 0.2s, opacity 0.2s;
        }
        .inv-note-card.is-done {
            border-left-color: var(--vert-menu);
            opacity: 0.68;
        }
        .inv-note-card.is-done .inv-note-title { text-decoration: line-through; }

        .inv-note-tag-done {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 9.5px;
            font-weight: 800;
            color: var(--vert-menu);
            background: rgba(0,77,64,0.08);
            border-radius: 5px;
            padding: 2px 6px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .inv-note-tag-done .material-icons { font-size: 11px; }

        .inv-note-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 6px;
        }

        .inv-note-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--bleu-marin);
            word-break: break-word;
        }

        .inv-note-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .inv-edit-btn, .inv-del-btn, .inv-done-btn {
            background: none;
            border: none;
            border-radius: 8px;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .inv-edit-btn { background: rgba(0,116,217,0.08); color: var(--bleu-clair); }
        .inv-del-btn  { background: rgba(231,76,60,0.08); color: var(--rouge); }
        .inv-done-btn { background: rgba(0,77,64,0.08); color: var(--vert-menu); }
        .inv-done-btn.is-done { background: var(--vert-menu); color: #ffffff; }
        .inv-edit-btn .material-icons,
        .inv-del-btn .material-icons,
        .inv-done-btn .material-icons { font-size: 16px; }

        .inv-note-desc {
            font-size: 13px;
            color: #555;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 8px;
        }

        .inv-note-date {
            font-size: 10.5px;
            color: #aaa;
            font-weight: 600;
        }

        .inv-empty-state {
            text-align: center;
            padding: 34px 10px;
            color: #ccc;
        }
        .inv-empty-state .material-icons { font-size: 40px; display: block; margin: 0 auto 10px; }
        .inv-empty-state p { font-size: 13px; color: #bbb; }

        @keyframes pulseBadge {
            0%   { box-shadow: 0 0 0 0 rgba(231,76,60,0.7); transform: scale(1); }
            50%  { transform: scale(1.15); }
            70%  { box-shadow: 0 0 0 8px rgba(231,76,60,0); }
            100% { box-shadow: 0 0 0 0 rgba(231,76,60,0); transform: scale(1); }
        }

        /* ── TOAST MINIM ── */
        #inv-toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            transform: translateX(-50%) translateY(10px);
            background: #1f2d3d;
            color: #fff;
            font-size: 12.5px;
            font-weight: 700;
            padding: 9px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.22);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s, transform 0.22s;
            z-index: 5000;
            white-space: nowrap;
        }
        #inv-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        #inv-toast .material-icons { font-size: 15px; color: #4CAF50; }
    </style>
</head>
<body>

<!-- ===== PAGE LOADER ===== -->
<div id="page-loader">
    <div class="pl-inner">
        <div class="pl-ring"></div>
        <img src="/lescayesdropshipping.png" alt="LCD" class="pl-logo">
    </div>
</div>

<!-- ===== TOP BAR ===== -->
<header id="top-bar">
    <button class="tb-back-btn" onclick="goBack()">
        <span class="material-icons">arrow_back</span>
    </button>
    <div class="tb-brand" onclick="goTo('index.html')">
        <img src="lescayesdropshipping.png" alt="LCD" class="tb-logo">
        <span class="tb-title">Envantè m</span>
    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main id="main-content">

    <!-- Kat eksplikasyon -->
    <div class="inv-intro-card">
        <div class="inv-intro-icon">
            <span class="material-icons">lightbulb</span>
        </div>
        <div>
            <div class="inv-intro-title">Poukisa espas sa a enpòtan?</div>
            <div class="inv-intro-text">Sèvi ak espas sa a pou ekri ti nòt sou koli w gen nan sèvis la, konsa wap toujou sonje ki valè machandiz wap tann pou resevwa.</div>
        </div>
    </div>

    <!-- Formulaire ajout / modifikasyon nòt -->
    <div class="inv-form-card">
        <div class="inv-form-title">
            <span class="material-icons" style="font-size:18px; color:var(--bleu-marin);">note_add</span>
            <span id="inv-form-label">Ekri yon nòt</span>
        </div>
        <input type="text" id="inv-titre" class="inv-input" placeholder="Tit... (ex: Aparèy pou tel bezwen)" maxlength="60">
        <textarea id="inv-desc" class="inv-input" placeholder="Deskripsyon... (ex: 3 sak manje bèt from Alibaba)"></textarea>
        <div class="inv-form-actions">
            <button class="inv-add-btn" id="inv-add-btn-main" onclick="invAdd()">
                <span class="material-icons" style="font-size:18px;">save</span>
                <span id="inv-add-btn-label">Anrejistre</span>
            </button>
            <button class="inv-cancel-btn" id="inv-cancel-btn" onclick="invCancelEdit()">
                Anile
            </button>
        </div>
    </div>

    <!-- Lis nòt yo -->
    <div class="inv-list-title" id="inv-list-title">Kòmand mwen yo</div>
    <div id="inv-notes-list"></div>

</main>

<!-- ===== TOAST MINIM ===== -->
<div id="inv-toast">
    <span class="material-icons">check_circle</span>
    <span id="inv-toast-text">Okazyon akonpli</span>
</div>

<script>
// ── PAGE LOADER ──────────────────────────────────────────────
window.goTo = function (url) {
    document.getElementById('page-loader').classList.add('show');
    setTimeout(() => { window.location.href = url; }, 480);
};

window.goBack = function () {
    if (document.referrer) {
        history.back();
    } else {
        goTo('index.html');
    }
};

window.addEventListener('load', () => {
    const l = document.getElementById('page-loader');
    if (l) l.classList.remove('show');
});

// ── NÒT KOLI — localStorage ──────────────────────────────────
const NOTES_KEY = 'lcd_koli_notes';

function notesLoad() {
    return JSON.parse(localStorage.getItem(NOTES_KEY) || '[]');
}

function notesSave(data) {
    localStorage.setItem(NOTES_KEY, JSON.stringify(data));
}

function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatNoteDate(ts) {
    const d = new Date(ts);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yy = String(d.getFullYear()).slice(-2);
    return `${dd}/${mm}/${yy}`;
}

function notesRender() {
    const list  = document.getElementById('inv-notes-list');
    const title = document.getElementById('inv-list-title');
    if (!list) return;

    const notes = notesLoad().sort((a, b) => b.updatedAt - a.updatedAt);

    if (title) title.textContent = notes.length ? `Kòmand mwen yo (${notes.length})` : 'Kòmand mwen yo';

    if (notes.length === 0) {
        list.innerHTML = `
            <div class="inv-empty-state">
                <span class="material-icons">inventory_2</span>
                <p>Ou poko ekri okenn kòmand. Sèvi ak fòm anwo a pou kòmanse.</p>
            </div>`;
        return;
    }

    list.innerHTML = notes.map(n => `
        <div class="inv-note-card ${n.done ? 'is-done' : ''}">
            <div class="inv-note-head">
                <div class="inv-note-title">${escHtml(n.titre) || 'San tit'}${n.done ? '<span class="inv-note-tag-done"><span class="material-icons">check</span>Akonpli</span>' : ''}</div>
                <div class="inv-note-actions">
                    <button class="inv-done-btn ${n.done ? 'is-done' : ''}" onclick="invToggleDone(${n.id})" title="Make kòm akonpli">
                        <span class="material-icons">check</span>
                    </button>
                    <button class="inv-edit-btn" onclick="invEdit(${n.id})" title="Modifye">
                        <span class="material-icons">edit</span>
                    </button>
                    <button class="inv-del-btn" onclick="invDelete(${n.id})" title="Efase">
                        <span class="material-icons">delete</span>
                    </button>
                </div>
            </div>
            <div class="inv-note-desc">${escHtml(n.desc)}</div>
            <div class="inv-note-date">Modifye ${formatNoteDate(n.updatedAt)}</div>
        </div>
    `).join('');
}

let invToastTimer = null;
function invShowToast(text) {
    const toast = document.getElementById('inv-toast');
    const label = document.getElementById('inv-toast-text');
    if (!toast || !label) return;
    label.textContent = text;
    toast.classList.add('show');
    clearTimeout(invToastTimer);
    invToastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

window.invToggleDone = function (id) {
    const notes = notesLoad();
    let becameDone = false;
    const updated = notes.map(n => {
        if (n.id === id) {
            becameDone = !n.done;
            return { ...n, done: !n.done, updatedAt: Date.now() };
        }
        return n;
    });
    notesSave(updated);
    notesRender();
    if (becameDone) invShowToast('Okazyon akonpli');
};

window.invAdd = function () {
    const titreEl = document.getElementById('inv-titre');
    const descEl  = document.getElementById('inv-desc');
    const addBtn  = document.getElementById('inv-add-btn-main');
    const editId  = addBtn ? parseInt(addBtn.getAttribute('data-edit-id') || '0') : 0;

    const titre = titreEl.value.trim();
    const desc  = descEl.value.trim();

    if (!desc) {
        descEl.classList.add('error');
        setTimeout(() => descEl.classList.remove('error'), 1200);
        return;
    }

    let notes = notesLoad();
    const now = Date.now();

    if (editId) {
        notes = notes.map(n => n.id === editId ? { ...n, titre, desc, updatedAt: now } : n);
    } else {
        notes.push({ id: now, titre, desc, createdAt: now, updatedAt: now });
    }

    notesSave(notes);
    invCancelEdit();
    notesRender();
};

window.invEdit = function (id) {
    const notes = notesLoad();
    const note  = notes.find(n => n.id === id);
    if (!note) return;

    document.getElementById('inv-titre').value = note.titre || '';
    document.getElementById('inv-desc').value  = note.desc || '';

    const addBtn = document.getElementById('inv-add-btn-main');
    if (addBtn) addBtn.setAttribute('data-edit-id', String(id));

    document.getElementById('inv-form-label').textContent    = 'Modifye nòt la';
    document.getElementById('inv-add-btn-label').textContent = 'Anrejistre chanjman';
    document.getElementById('inv-cancel-btn').style.display  = 'flex';

    document.getElementById('inv-titre').focus();
    window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.invCancelEdit = function () {
    document.getElementById('inv-titre').value = '';
    document.getElementById('inv-desc').value  = '';

    const addBtn = document.getElementById('inv-add-btn-main');
    if (addBtn) addBtn.removeAttribute('data-edit-id');

    document.getElementById('inv-form-label').textContent    = 'Ekri yon nòt';
    document.getElementById('inv-add-btn-label').textContent = 'Anrejistre';
    document.getElementById('inv-cancel-btn').style.display  = 'none';
};

window.invDelete = function (id) {
    if (!confirm('Efase nòt sa a?')) return;
    notesSave(notesLoad().filter(n => n.id !== id));
    notesRender();
};

// ── INIT ──────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    notesRender();
});
</script>
</body>
</html>
